name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 校验插件并检查产物是否同步
        run: node tools/build.mjs --check

      - name: 检查 JSON 可解析
        run: |
          node -e "JSON.parse(require('fs').readFileSync('gallery.json','utf8')); console.log('gallery.json OK')"

      - name: 检查中文标点与全角空格
        run: |
          if grep -rnP '[\x{3000}]' plugins/ ; then
            echo "发现全角空格，请替换为半角"; exit 1
          fi
          echo "OK"
